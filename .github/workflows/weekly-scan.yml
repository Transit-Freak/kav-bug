name: סריקה שבועית (כל הארץ + פערי רכבת)

# מוריד את ה-GTFS הארצי *פעם אחת* (עם retry — השרת של משרד התחבורה נופל לפעמים),
# ומריץ את שתי הסריקות על אותו קובץ: scan-country.js (עיקופי אוטובוסים, "כל
# הארץ") ו-rail-gaps.js (פערי רכבת מול ה-API של רכבת ישראל). מעדכן history.json
# (מגמות) ודוחף הכל בקומיט אחד. רץ אוטומטית כל יום ראשון + הפעלה ידנית.
#
# הגנה: אם rail-gaps.js נכשל או מחזיר 0 רכבות שנבדקו (ה-API של רכבת ישראל או
# data.gov.il לא זמינים באותו רגע) — משחזרים את rail-gaps.json/csv הקודמים
# מ-git במקום לדרוס אותם בדוח ריק. scan-country.js (הסריקה העיקרית) ממשיך
# להיכשל-בקול אם משהו שובר אותו — אין הגנה מקבילה שם בכוונה.
on:
  schedule:
    - cron: "0 3 * * 0"   # יום ראשון, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: התקנת תלות (fflate)
        run: npm install fflate --no-save

      - name: הורדת ה-GTFS הארצי ממשרד התחבורה (עם retry)
        run: |
          curl -sSL --retry 6 --retry-delay 15 --retry-all-errors --max-time 900 \
            -o israel-gtfs.zip \
            https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip
          ls -lh israel-gtfs.zip

      - name: סריקת כל הארץ (עיקופי אוטובוסים)
        run: node --max-old-space-size=6144 scan-country.js israel-gtfs.zip country-scan

      - name: השוואת רכבות מול רכבת ישראל (רך לכשל — לא עוצר את הסריקה)
        run: node rail-gaps.js israel-gtfs.zip rail-gaps || echo "::warning::rail-gaps.js נכשל — יישמר הדוח הקודם"

      - name: הגנה מפני דוח-רכבת ריק (אם ה-API/data.gov.il לא זמינים)
        run: |
          KEEP_OLD=0
          if [ ! -f rail-gaps.json ]; then
            echo "rail-gaps.json לא נוצר כלל."
            KEEP_OLD=1
          else
            CHECKED=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('rail-gaps.json','utf8'));console.log(j.trainsChecked||0)}catch(e){console.log(0)}")
            echo "trainsChecked=$CHECKED"
            if [ "$CHECKED" = "0" ]; then KEEP_OLD=1; fi
          fi
          if [ "$KEEP_OLD" = "1" ]; then
            echo "משחזר את rail-gaps.json/csv הקודמים מ-git (לא דורס בדוח ריק)."
            git checkout -- rail-gaps.json rail-gaps.csv 2>/dev/null || echo "אין גרסה קודמת ב-git — נשאר ריק."
          fi

      - name: עדכון היסטוריית-מגמות (history.json)
        run: node update-history.js country-scan.json rail-gaps.json history.json

      - name: ניקוי קובץ ה-GTFS הגדול (לא נשמר בריפו)
        run: rm -f israel-gtfs.zip

      - name: עדכון הריפו (רק אם השתנה)
        run: |
          git config user.name "kavbug-bot"
          git config user.email "kavbug-bot@users.noreply.github.com"
          git add country-scan.json country-scan.csv rail-gaps.json rail-gaps.csv history.json
          if git diff --staged --quiet; then
            echo "אין שינוי — לא מבצע commit."
          else
            git commit -m "סריקה שבועית: כל הארץ + פערי רכבת ($(date -u +%Y-%m-%d))"
            git push
          fi

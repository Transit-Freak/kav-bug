name: סנכרון מהסריקה המאוחדת

# הסריקה עצמה רצה בצינור היומי האחד של "הקו הבוחן" (10:30 ישראל) על אותו
# GTFS של כל האתרים; כאן רק מושכים את התוצאות המוכנות (kavbug-data/) —
# האתר נשאר באותה כתובת בדיוק, בלי סריקה כפולה ובלי הורדת GTFS נוספת.
# קוד הזיהוי (data.js / scan-country.js) ממשיך לחיות כאן — הצינור מושך
# אותו מכאן בזמן ריצה.
on:
  schedule:
    - cron: "45 8 * * *"   # 11:45 ישראל בקיץ — אחרי שהצינור המאוחד מסיים
  workflow_dispatch: {}
  push:
    branches: [scan-go]    # הצתה ידנית מיידית — נשארת
permissions:
  contents: write
concurrency:
  group: weekly-scan
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: משיכת תוצאות הסריקה מהקו הבוחן
        run: |
          set -e
          BASE=https://raw.githubusercontent.com/Transit-Freak/kav-bochan/main/kavbug-data
          for f in country-scan.json country-scan.csv history.json; do
            curl -fsSL "$BASE/$f" -o "$f.new"
          done
          # ולידציה לפני החלפה — לא מחליפים קבצים חיים בתוכן שבור
          python3 -c "import json; json.load(open('country-scan.json.new')); json.load(open('history.json.new'))"
          for f in country-scan.json country-scan.csv history.json; do mv "$f.new" "$f"; done
          git config user.name kavbug-bot
          git config user.email kavbug-bot@users.noreply.github.com
          git add country-scan.json country-scan.csv history.json
          if git diff --staged --quiet; then
            echo "אין שינוי — הסריקה המאוחדת טרם עדכנה"
          else
            git commit -m "סנכרון מהסריקה המאוחדת ($(date -u +%Y-%m-%d))"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

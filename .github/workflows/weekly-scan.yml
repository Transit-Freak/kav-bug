name: סריקה שבועית (כל הארץ)

# מוריד את ה-GTFS הארצי (עם retry — השרת של משרד התחבורה נופל לפעמים) ומריץ
# את scan-country.js (עיקופי אוטובוסים, "כל הארץ"). מעדכן history.json
# (מגמות) ודוחף הכל בקומיט אחד. רץ אוטומטית כל יום ראשון + הפעלה ידנית.
#
# הערה: בעבר הכלי כלל גם השוואת-רכבות מול ה-API של רכבת ישראל (rail-gaps.js).
# רכבת ישראל התבקשה לאשר את השימוש ב-API הציבורי שלה וסירבה, ולכן ההשוואה
# הוסרה מכאן לחלוטין — אין יותר שום קריאה ל-API של רכבת ישראל, אוטומטית או
# ידנית. פרטים בדף rail.html.
on:
  schedule:
    - cron: "0 3 * * 0"   # יום ראשון, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: התקנת תלות (fflate)
        run: npm install fflate --no-save

      - name: הורדת ה-GTFS הארצי ממשרד התחבורה (עם retry)
        run: |
          curl -sSL --retry 6 --retry-delay 15 --retry-all-errors --max-time 900 \
            -o israel-gtfs.zip \
            https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip
          ls -lh israel-gtfs.zip

      - name: סריקת כל הארץ (עיקופי אוטובוסים)
        run: node --max-old-space-size=6144 scan-country.js israel-gtfs.zip country-scan

      - name: עדכון היסטוריית-מגמות (history.json)
        run: node update-history.js country-scan.json history.json

      - name: ניקוי קובץ ה-GTFS הגדול (לא נשמר בריפו)
        run: rm -f israel-gtfs.zip

      - name: עדכון הריפו (רק אם השתנה)
        run: |
          git config user.name "kavbug-bot"
          git config user.email "kavbug-bot@users.noreply.github.com"
          git add country-scan.json country-scan.csv history.json
          if git diff --staged --quiet; then
            echo "אין שינוי — לא מבצע commit."
          else
            git commit -m "סריקה שבועית: כל הארץ ($(date -u +%Y-%m-%d))"
            git push
          fi

name: סריקה יומית (כל הארץ)

# מוריד את ה-GTFS הארצי (עם retry — השרת של משרד התחבורה נופל לפעמים) ומריץ
# את scan-country.js (עיקופי אוטובוסים, "כל הארץ"). מעדכן history.json
# (מגמות) ודוחף הכל בקומיט אחד. רץ אוטומטית כל לילה + הפעלה ידנית
# (בקשת משתמש: קובץ ה-GTFS מתחדש יומית — אין סיבה לחכות שבוע).
#
# הערה: בעבר הכלי כלל גם השוואת-רכבות מול ה-API של רכבת ישראל (rail-gaps.js).
# רכבת ישראל התבקשה לאשר את השימוש ב-API הציבורי שלה וסירבה, ולכן ההשוואה
# הוסרה מכאן לחלוטין — אין יותר שום קריאה ל-API של רכבת ישראל, אוטומטית או
# ידנית. פרטים בדף rail.html.
on:
  schedule:
    # מיושר לצינור היומי של "הקו בזמן" (07:30 UTC — אחרי חלון הפרסום של
    # משרד התחבורה): אותו קובץ, אותו בוקר, אחד אחרי השני — כמו צינור אחד
    - cron: "0 8 * * *"   # 08:00 UTC (11:00 ישראל בקיץ)
  workflow_dispatch: {}
  push:
    branches: [scan-go]   # ענף-הצתה להרצה ידנית מיידית

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: התקנת תלות (fflate)
        run: npm install fflate --no-save

      - name: הורדת ה-GTFS הארצי (משרד התחבורה, עם גיבוי מארכיון האוטובוס הפתוח)
        run: |
          # השרת של משרד התחבורה נופל/חוסם לפעמים — אותו קובץ בדיוק מועלה כל
          # בוקר לארכיון הציבורי של האוטובוס הפתוח (S3), שיציב בהרבה.
          if ! curl -sSL --retry 3 --retry-delay 10 --retry-all-errors --max-time 600 \
              -o israel-gtfs.zip \
              https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip; then
            echo "משרד התחבורה לא זמין — עובר לארכיון האוטובוס הפתוח"
            for D in "$(date -u +%Y/%m/%d)" "$(date -u -d yesterday +%Y/%m/%d)"; do
              echo "מנסה את קובץ ${D}…"
              if curl -sSL --retry 3 --retry-delay 10 --retry-all-errors --max-time 900 \
                  -o israel-gtfs.zip \
                  "https://openbus-stride-public.s3.eu-west-1.amazonaws.com/gtfs_archive/${D}/israel-public-transportation.zip"; then
                break
              fi
            done
          fi
          ls -lh israel-gtfs.zip
          # ודא שזה באמת ZIP ולא דף שגיאה
          head -c 2 israel-gtfs.zip | grep -q PK

      - name: סריקת כל הארץ (עיקופי אוטובוסים)
        run: node --max-old-space-size=6144 scan-country.js israel-gtfs.zip country-scan

      - name: עדכון היסטוריית-מגמות (history.json)
        run: node update-history.js country-scan.json history.json

      - name: ניקוי קובץ ה-GTFS הגדול (לא נשמר בריפו)
        run: rm -f israel-gtfs.zip

      - name: עדכון הריפו (רק אם השתנה)
        run: |
          git config user.name "kavbug-bot"
          git config user.email "kavbug-bot@users.noreply.github.com"
          git add country-scan.json country-scan.csv history.json
          if git diff --staged --quiet; then
            echo "אין שינוי — לא מבצע commit."
          else
            git commit -m "סריקה יומית: כל הארץ ($(date -u +%Y-%m-%d))"
            # תמיד ל-main — גם כשהריצה הוצתה מענף scan-go. אם main זז בזמן
            # הסריקה (מיזוג PR) — מיישרים לפניו; קובצי התוצאה לא מתנגשים בקוד.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

name: סנכרון קו-באג לתוך "הקו הבוחן" (kav-bochan)

# בכל push ל-main, מעתיק את קבצי-האתר הנפרסים (index.html, קוד, סגנון, ודוחות
# כל-הארץ/רכבת) לתוך תת-התיקייה kavbug/ בריפו kav-bochan, כדי ש"הקו הבוחן"
# תמיד יציג את הגרסה העדכנית של קו באג — בלי העתקה ידנית.
#
# דורש סוד (secret) בשם KAVBOCHAN_TOKEN בריפו הזה: Personal Access Token
# (fine-grained) עם הרשאת Contents: Read and write על הריפו Transit-Freak/kav-bochan.
# ליצירה: github.com/settings/tokens?type=beta → Generate new token → Repository
# access: Only select repositories → kav-bochan → Permissions → Contents: Read and
# write. את הטוקן שנוצר יש להוסיף כ-secret בריפו הזה: Settings → Secrets and
# variables → Actions → New repository secret → שם: KAVBOCHAN_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data.js"
      - "components.jsx"
      - "app.jsx"
      - "styles.css"
      - "rail.html"
      - "kavbug/**"
      - "vendor/**"
      - "country-scan.json"
      - "country-scan.csv"
      - "country-scan-lite.json"
      - "country-geo.json"
      - "history.json"
      - "rail-gaps.json"
      - "rail-gaps.csv"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-kav-bochan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: קלוט את קו-באג
        uses: actions/checkout@v4
        with:
          path: kav-bug

      - name: קלוט את הקו-הבוחן
        uses: actions/checkout@v4
        with:
          repository: Transit-Freak/kav-bochan
          token: ${{ secrets.KAVBOCHAN_TOKEN }}
          path: kav-bochan

      - name: העתקת קבצי-האתר לתוך kav-bochan/kavbug/
        run: |
          mkdir -p kav-bochan/kavbug/kavbug
          cp kav-bug/index.html kav-bug/data.js kav-bug/components.jsx kav-bug/app.jsx \
             kav-bug/styles.css kav-bug/rail.html \
             kav-bug/country-scan.json kav-bug/country-scan.csv \
             kav-bug/country-scan-lite.json kav-bug/country-geo.json kav-bug/history.json \
             kav-bug/rail-gaps.json kav-bug/rail-gaps.csv \
             kav-bochan/kavbug/
          mkdir -p kav-bochan/kavbug/vendor
          cp kav-bug/vendor/react.production.min.js kav-bug/vendor/react-dom.production.min.js \
             kav-bochan/kavbug/vendor/
          cp kav-bug/kavbug/gtfs-worker.js kav-bochan/kavbug/kavbug/

      - name: עדכון הריפו kav-bochan (רק אם השתנה)
        working-directory: kav-bochan
        run: |
          git config user.name "kavbug-sync-bot"
          git config user.email "kavbug-bot@users.noreply.github.com"
          git add kavbug
          if git diff --staged --quiet; then
            echo "אין שינוי — לא מבצע commit."
          else
            git commit -m "סנכרון קו-באג ($(date -u +%Y-%m-%d))"
            git push
          fi

name: פערי רכבת (GTFS מול רכבת ישראל)

# מוריד את ה-GTFS הארצי, מריץ את rail-gaps.js שמשווה כל רכבת מול ה-API החי של
# רכבת ישראל, ומעדכן את rail-gaps.json / rail-gaps.csv בריפו. רץ פעם בשבוע + ידני.
on:
  schedule:
    - cron: "30 3 * * 1"   # יום שני, 03:30 UTC (אחרי סריקת-האוטובוסים)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rail-gaps
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: התקנת תלות (fflate)
        run: npm install fflate --no-save

      - name: הורדת ה-GTFS הארצי ממשרד התחבורה
        run: |
          curl -sSL --retry 4 --retry-delay 10 --max-time 600 \
            -o israel-gtfs.zip \
            https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip
          ls -lh israel-gtfs.zip

      - name: השוואת רכבות מול רכבת ישראל
        run: node rail-gaps.js israel-gtfs.zip rail-gaps

      - name: ניקוי קובץ ה-GTFS הגדול (לא נשמר בריפו)
        run: rm -f israel-gtfs.zip

      - name: עדכון הדוח בריפו (רק אם השתנה)
        run: |
          git config user.name "kavbug-bot"
          git config user.email "kavbug-bot@users.noreply.github.com"
          git add rail-gaps.json rail-gaps.csv
          if git diff --staged --quiet; then
            echo "אין שינוי בדוח — לא מבצע commit."
          else
            git commit -m "עדכון פערי-רכבת ($(date -u +%Y-%m-%d))"
            git push
          fi

name: api-probe
# בדיקה חד-פעמית של ה-API של הסדנא — אבחון עמוד המפעילה בדאטאבוס
on:
  push:
    branches: [api-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: שאילתות כמו של עמוד המפעילה
        run: |
          B="https://open-bus-stride-api.hasadna.org.il"
          TODAY=$(date -u +%F)
          YDAY=$(date -u -d '1 day ago' +%F)
          WEEK=$(date -u -d '8 days ago' +%F)
          OLD_FROM="2026-07-20"; OLD_TO="2026-07-21"
          probe() { echo "== $1"; curl -s --max-time 30 "$2" | head -c 700; echo; echo "-- items: $(curl -s --max-time 30 "$2" | python3 -c 'import json,sys
try: print(len(json.load(sys.stdin)))
except Exception as e: print("ERR", e)')"; }
          probe "agencies (אתמול)" "$B/gtfs_agencies/list?date_from=$YDAY"
          probe "group_by היום-1..היום (כמו העמוד, יומי)" "$B/gtfs_rides_agg/group_by?date_from=$YDAY&date_to=$TODAY&group_by=operator_ref&exclude_hours_from=23&exclude_hours_to=2"
          probe "group_by שבוע שעבר" "$B/gtfs_rides_agg/group_by?date_from=$WEEK&date_to=$(date -u -d '7 days ago' +%F)&group_by=operator_ref&exclude_hours_from=23&exclude_hours_to=2"
          probe "group_by טווח ישן ($OLD_FROM)" "$B/gtfs_rides_agg/group_by?date_from=$OLD_FROM&date_to=$OLD_TO&group_by=operator_ref&exclude_hours_from=23&exclude_hours_to=2"
          probe "group_by בלי exclude" "$B/gtfs_rides_agg/group_by?date_from=$YDAY&date_to=$TODAY&group_by=operator_ref"
